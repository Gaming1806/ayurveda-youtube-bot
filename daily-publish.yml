name: Ayurvedic Video Bot

on:
  schedule:
    # Runs every day at 09:00 UTC. Change cron if you want a different cadence.
    - cron: '0 9 * * *'
  workflow_dispatch:   # Allows manual trigger from the UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YT_OAUTH_TOKEN: ${{ secrets.YT_OAUTH_TOKEN }}

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout repo + set up Python
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # 2️⃣ Restore OAuth client_secret.json
      # -------------------------------------------------
      - name: Decode Google client secret
        run: |
          echo "${GOOGLE_CLIENT_SECRET}" | base64 -d > ./client_secret.json

      # -------------------------------------------------
      # 3️⃣ (Re)generate / refresh OAuth token if missing
      # -------------------------------------------------
      - name: Restore or create token.json
        if: env.YT_OAUTH_TOKEN != ''
        run: |
          echo "${YT_OAUTH_TOKEN}" | base64 -d > ./token.json
      - name: Run OAuth flow (if token missing)
        if: env.YT_OAUTH_TOKEN == ''
        run: |
          echo "⚠️ No pre‑shared token – add YT_OAUTH_TOKEN secret or run the OAuth dance locally."

      # -------------------------------------------------
      # 4️⃣ Generate content (script, title, tags, description)
      # -------------------------------------------------
      - name: Generate Ayurvedic video content
        id: content
        run: |
          python scripts/generate_content.py > generated.json
          cat generated.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # -------------------------------------------------
      # 5️⃣ Text‑to‑Speech (voice‑over)
      # -------------------------------------------------
      - name: Generate voice‑over MP3
        id: tts
        run: |
          python scripts/text_to_speech.py \
            --text "$(jq -r .script generated.json)" \
            --output voiceover.mp3

      # -------------------------------------------------
      # 6️⃣ Fetch royalty‑free footage (Pexels)
      # -------------------------------------------------
      - name: Download video clip
        id: footage
        run: |
          python scripts/fetch_footage.py \
            --query "ginger lemon tea ayurvedic" \
            --output footage.mp4

      # -------------------------------------------------
      # 7️⃣ Generate thumbnail (Pillow no‑key version)
      # -------------------------------------------------
      - name: Create thumbnail image
        id: thumb
        run: |
          python scripts/generate_thumbnail.py \
            --title "$(jq -r .title generated.json)" \
            --output thumbnail.jpg

      # -------------------------------------------------
      # 8️⃣ Assemble final video (voice + footage)
      # -------------------------------------------------
      - name: Build final MP4
        run: |
          python scripts/assemble_video.py \
            --voice voiceover.mp3 \
            --footage footage.mp4 \
            --output final_video.mp4 \
            --duration 60

      # -------------------------------------------------
      # 9️⃣ Upload to YouTube (private)
      # -------------------------------------------------
      - name: Upload video + set thumbnail
        id: youtube
        run: |
          python scripts/upload_to_youtube.py \
            --title "$(jq -r .title generated.json)" \
            --description "$(jq -r .description generated.json)" \
            --tags "$(jq -r '.tags | join(", ")' generated.json)" \
            --video final_video.mp4 \
            --thumbnail thumbnail.jpg \
            --privacy private

      # (Optional) Add a step to tweet / Discord, etc.